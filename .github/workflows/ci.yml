name: CI

# The overall run conclusion (success/failure) of THIS workflow IS the merge gate:
# .github/workflows/auto-merge-claude.yml triggers on this workflow's completion
# (workflow_run) and merges a branch's exact tip commit into main ONLY if the CI
# run for that SHA concluded "success". Do NOT add `continue-on-error` to any step
# in either job below — a step marked continue-on-error can fail silently while the
# job (and therefore the run) still reports "success", which would let broken code
# merge to main with zero red signal anywhere.
#
# `push:` below is filtered with `branches: ['**']`, which matches EVERY branch
# (including ones with slashes, like `claude/foo`) and therefore preserves the
# load-bearing property that every branch push produces a CI run the merge gate can
# read, while excluding tag pushes (which nothing consumes — auto-merge-claude.yml
# only ever iterates branch heads under refs/remotes/origin/*, so a tag's CI run was
# previously just an unnecessary macOS build with no consumer).
#
# Do NOT narrow this further. auto-merge-claude.yml looks up the CI run for a
# branch's exact tip SHA (repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs
# ?head_sha=$sha) and fails CLOSED — no run found means the branch is skipped, every
# single drain, forever. A commit that produces no CI run at all (because it didn't
# match a branch filter, or only touched paths excluded by a paths-ignore filter) can
# therefore NEVER merge — it would be stranded permanently, recoverable only by a
# human pushing an unrelated matching change. If you ever need to skip expensive work
# for e.g. docs-only changes, gate the JOB (or a step) with an `if:` condition instead
# — the workflow run still exists and still concludes "success", so auto-merge still
# sees a green gate for that SHA.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Scoped to ${{ github.sha }}, not just ${{ github.ref }}, because
# auto-merge-claude.yml's one-shot `gh run rerun` re-enters this concurrency group at
# whatever the current wall-clock moment is. A ref-scoped group would let that re-run
# of an OLDER sha cancel the in-progress run of the branch's CURRENT tip if a
# developer pushes a fix at nearly the same time — leaving the tip's only run
# "cancelled", which the merge gate rejects (is_ci_green) and which the one-shot
# retry never repairs (should_retry_failed_ci only ever fires on an exact "failure"
# conclusion, never "cancelled"). That strands the branch permanently until a human
# intervenes. Scoping the group to the exact commit means runs for different SHAs can
# never cancel each other, so this failure mode cannot occur.
#
# Accepted cost: two rapid pushes to the same branch now each get their own full CI
# run — including a macOS build — instead of the older one being
# cancelled. A wasted run is a strictly better outcome than a permanently stranded
# branch.
concurrency:
  group: ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: shell-lint + actionlint + auto-merge logic tests
    runs-on: ubuntu-latest
    # ubuntu-latest, not macos-latest: this job needs no AppKit/Swift toolchain, and
    # Keep platform-neutral checks on Ubuntu; only the `build` job below needs
    # macOS to compile and run the AppKit application.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # BLOCKING GATE: actionlint statically checks every workflow file (and runs
      # shellcheck on each embedded `run:` block). A *blocking* linter must be pinned
      # so that a future actionlint release adding a new check cannot suddenly
      # red-light every merge out of nowhere — bump this pin deliberately instead.
      - name: Cache actionlint binary (pinned v1.7.12)
        id: cache-actionlint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: actionlint
          key: actionlint-v1.7.12-${{ runner.os }}
      - name: Install actionlint (pinned v1.7.12)
        if: steps.cache-actionlint.outputs.cache-hit != 'true'
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
      - name: actionlint (workflow YAML + embedded run-block bash via shellcheck)
        run: ./actionlint -color

      - name: shellcheck standalone scripts (warning+ blocks)
        run: |
          set -euo pipefail
          # nullglob so a non-matching pattern disappears instead of being passed to
          # the linter below as a literal, nonexistent path (bash's default when
          # nothing matches a glob). Zero files found is treated as an ERROR, not a
          # silent no-op -- a broken checkout or an accidentally-deleted directory
          # should fail loudly here rather than let this step pass having checked
          # nothing.
          shopt -s nullglob
          # build_app.sh is named explicitly: it lives at the repo root, so no
          # directory glob below reaches it, and it was going unlinted despite
          # being the script that assembles and codesigns the shipped .app.
          #
          # build_app.ps1 (also at the repo root, the Windows equivalent of
          # build_app.sh) is deliberately NOT listed here and must never be:
          # it's PowerShell, and shellcheck lints POSIX/bash shell script --
          # pointing it at a .ps1 file either errors out or, worse, "passes"
          # having not actually checked anything meaningful. None of the
          # patterns below are broad enough to glob it in today (there's no
          # bare `*.sh`/`*` at the repo root, only the explicit build_app.sh
          # name and directory-scoped `dir/*.sh` globs), but the exclude
          # filter right after this array is a deliberate backstop: if this
          # list is ever loosened to a root-level glob, a stray *.ps1 gets
          # silently dropped here instead of failing the lint (or falsely
          # passing) on a file it can't parse.
          files=(build_app.sh scripts/*.sh tests/*.sh .claude/*.sh)
          shopt -u nullglob
          existing=()
          for f in "${files[@]}"; do
            case "$f" in
              *.ps1) continue ;;
            esac
            [ -f "$f" ] && existing+=("$f")
          done
          if [ "${#existing[@]}" -eq 0 ]; then
            echo "::error::shellcheck found zero .sh files across build_app.sh, scripts/, tests/, .claude/ — broken checkout or repo layout, not nothing to check."
            exit 1
          fi
          # Floored at -S warning (unpinned, whatever ships on the runner): only
          # warnings/errors block. The scripts pass clean today; this just stops a
          # future shellcheck release's new *style/info*-level nit from wedging a
          # blocking gate.
          shellcheck -S warning "${existing[@]}"

      - name: workflow_run trigger name stays in sync (auto-merge-claude.yml <-> ci.yml name:)
        # actionlint does NOT catch this: auto-merge-claude.yml's on.workflow_run.workflows
        # matches against a workflow's name: field, not its filename. Renaming this
        # workflow's `name:` without updating that array would silently and permanently
        # stop CI completions from re-triggering auto-merge, with zero red CI signal.
        #
        # The grep below is anchored to the indented `workflows:` YAML key specifically
        # (leading whitespace, then `workflows:`, then the opening `[`) so that a `#`
        # comment merely mentioning the word "workflows:" elsewhere in the file can
        # neither satisfy this check (reading a stale comment instead of the real array
        # and reporting OK on an actual desync) nor break it (a correct file must still
        # match the real key line, not an unrelated comment). The trailing `|| true` on
        # the grep is required, not decorative: under `set -e`, a `var="$(cmd)"`
        # assignment whose command substitution exits non-zero (grep's exit status when
        # it finds NO match) aborts the script right there, bare, before the `if [ -z
        # "$line" ]` guard below ever runs — silently skipping this whole check with no
        # ::error:: at all. `|| true` lets a no-match assign an empty string instead, so
        # the guard is what reports the failure, loudly, as intended.
        run: |
          set -euo pipefail
          ci_name="$(grep -m1 '^name:' .github/workflows/ci.yml | sed 's/^name:[[:space:]]*//')"
          line="$(grep -m1 -E '^[[:space:]]+workflows:[[:space:]]*\[' .github/workflows/auto-merge-claude.yml || true)"
          if [ -z "$line" ]; then
            echo "::error::could not find the on.workflow_run.workflows array in .github/workflows/auto-merge-claude.yml -- the merge trigger may have been restructured; this check cannot verify it."
            exit 1
          fi
          mapfile -t triggers < <(printf '%s' "$line" | grep -oP '(?<=\[)[^]]*(?=\])' | tr ',' '\n' | sed 's/^[[:space:]]*"//; s/"[[:space:]]*$//')
          found=0
          for t in "${triggers[@]}"; do [ "$t" = "$ci_name" ] && found=1 && break; done
          if [ "$found" -eq 0 ]; then
            echo "::error::auto-merge-claude.yml's on.workflow_run.workflows is missing [$ci_name] (this file's name: field) -- CI completions will silently stop re-triggering auto-merge."
            exit 1
          fi
          echo "OK: workflow_run trigger name matches ci.yml's name: field."

      # The most CONSEQUENTIAL automation in this repo is the embedded bash that decides
      # whether a branch's work reaches main (auto_merge_decision.sh, consumed by
      # auto-merge-claude.yml). This is therefore a hard BLOCKING gate, not an advisory
      # check: a failure here fails the CI run, which fails the merge gate above.
      - name: auto-merge decision logic (CI-gate + delete-safety fixtures)
        run: bash tests/test_auto_merge_logic.sh

      - name: MCP stdio harness syntax + framing/timeout tests
        # The full integration script needs macOS AppKit/Aqua plus live screenshot
        # and presentation conditions that this cheap Ubuntu job cannot provide, but
        # its protocol framing and deadline behavior are pure Python and must be
        # exercised here rather than merely syntax-checked. The macOS build job below
        # separately launches the packaged app for its headless ping/backpressure
        # slice. tests/test_suspension_two_process.py and
        # tests/test_capture_visible_two_process.py each launch the full app twice
        # (opt-in only via their own env-var gates -- see their module docstrings), so
        # they get syntax-check-only treatment here; without this they were
        # py_compile'd nowhere.
        run: |
          python3 -m py_compile test_mcp_stdio.py tests/test_mcp_stdio_harness.py tests/test_suspension_two_process.py tests/test_capture_visible_two_process.py
          python3 -m unittest tests/test_mcp_stdio_harness.py

      - name: MCP wire-snapshot tool syntax + canonicalisation tests
        # tests/mcp_wire_snapshot.py's own `capture` subcommand launches the real
        # AIChalkboard binary and, like the full test_mcp_stdio.py integration script,
        # needs an Aqua GUI session this runner does not have -- so it is exercised by
        # hand (see the tool's own docstring), never here. Its canonicalisation,
        # masking, diffing, and self-check logic, however, is pure Python with no
        # process to launch and no stdio to fake, exactly like test_mcp_stdio_harness.py
        # above, and unittest actually RUNS it rather than merely importing it -- a
        # syntax error or an accidentally-deleted test class would fail this step, not
        # pass it silently.
        run: |
          python3 -m py_compile tests/mcp_wire_snapshot.py tests/test_mcp_wire_snapshot.py
          python3 -m unittest tests/test_mcp_wire_snapshot.py

      - name: Cross-platform protocol conformance (both platforms, no SDK needed)
        # The macOS/Windows split is a set of small protocols with one conformance
        # per platform. Whoever is editing this repo can usually only COMPILE ONE OF
        # THE TWO, so adding or renaming a protocol requirement breaks the other
        # platform's conformance silently until somebody builds there -- the single
        # most likely way this architecture regresses.
        #
        # This check is pure Python: no Swift toolchain, no platform SDK, so it runs
        # here on ubuntu and covers BOTH platforms at once, including the one the
        # author could not build. It is deliberately in this job rather than the
        # macOS/Windows build jobs for that reason.
        #
        # It is structural, not a type check (see the script's docstring) -- it
        # supplements the real per-platform builds below, never replaces them.
        run: |
          python3 -m py_compile tests/check_platform_conformance.py
          python3 tests/check_platform_conformance.py

      - name: Swift test target path casing
        # The repository's established directory is lowercase `tests/`. This catches
        # a manifest/new-file case mismatch that case-insensitive macOS volumes hide.
        run: test -d tests/AIChalkboardCoreTests

  build:
    name: swift build (debug + release) + app bundle
    runs-on: macos-latest
    # This job only does what genuinely requires macOS/AppKit; platform-neutral
    # validation stays in the Ubuntu `checks` job above.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Toolchain version (recorded in the log)
        run: swift --version

      - name: swift test
        run: swift test

      - name: swift build (debug)
        run: swift build

      - name: swift build (release)
        run: swift build -c release

      # Every macOS runner can exercise .app assembly with the explicit,
      # test-only ad-hoc-signing mode. It is deliberately opt-in and is never a
      # release fallback: the normal build_app.sh path below remains fail-closed.
      - name: Assemble and verify test .app bundle (clean-mac safe)
        run: bash tests/test_deployment_layout.sh --assemble-test-bundle

      - name: MCP remains responsive with undrained stderr
        # The test launches the fresh isolated `.test-dist` bundle above and
        # deliberately never consumes the child's stderr pipe. It proves
        # diagnostics cannot fill that pipe and stall JSON-RPC replies.
        run: python3 -m unittest tests/test_logger_stderr_backpressure.py

  build-windows:
    name: swift build (debug + release) + swift test (Windows)
    runs-on: windows-latest
    timeout-minutes: 35
    # This job builds and tests the Windows port directly; the Ubuntu checks job
    # already handles platform-neutral validation.
    #
    # Packaging is intentionally outside CI because release signing and the
    # final runtime layout require platform-specific credentials and tooling.
    # The Swift/C++ build and test suite remain fully covered here.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # compnerd/gha-setup-swift, not swift-actions/setup-swift: compnerd is
      # the Swift project's own Windows-platform maintainer and this action is
      # the long-standing, actively-used way Swift's own Windows CI (and
      # downstream Windows-porting projects) install a toolchain on
      # windows-latest. swift-actions/setup-swift markets itself as
      # multi-platform, but as of this writing its own issue tracker has open
      # reports of specific recent Swift versions being unavailable on
      # Windows -- a live risk for a repo that (like this one) tracks a
      # specific pinned Swift version. Pinned to v0.5.0 (not @main), the same
      # tag-pinning convention this file already uses for actions/checkout
      # and actions/cache above, so a future release of the action can't
      # silently change how the toolchain gets installed on this blocking
      # gate.
      - name: Install Swift toolchain (Windows)
        uses: compnerd/gha-setup-swift@bbae8ce86bac5a3449f3992b3d88bc4ca25f2057 # v0.5.0
        with:
          swift-version: swift-6.3.3-release
          swift-build: 6.3.3-RELEASE

      - name: Toolchain version (recorded in the log)
        run: swift --version

      - name: swift build (debug)
        run: swift build

      - name: swift build (release)
        run: swift build -c release

      - name: MCP remains responsive with undrained stderr (Windows)
        shell: pwsh
        run: |
          $binaryDirectory = swift build -c release --show-bin-path | Select-Object -Last 1
          $binaryPath = Join-Path $binaryDirectory.Trim() "AIChalkboard.exe"
          if (-not (Test-Path -LiteralPath $binaryPath -PathType Leaf)) {
            throw "Release executable is missing at $binaryPath"
          }
          $env:AI_CHALKBOARD_LOGGER_TEST_BINARY = $binaryPath
          python -m unittest tests/test_logger_stderr_backpressure.py

      - name: swift test
        run: swift test
