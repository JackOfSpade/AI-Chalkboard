name: CodeQL

on:
  push:
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 3 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze ${{ matrix.language }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # Swift CodeQL needs the macOS build, while the C++ shim is only in
        # SwiftPM's dependency graph on Windows. Keeping these as distinct
        # language/platform entries ensures each extractor sees a real build.
        include:
          - language: swift
            os: macos-latest
          - language: c-cpp
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # CChalkboardWin is built through SwiftPM on Windows, so install the
      # same pinned toolchain used by the Windows CI build before CodeQL
      # starts recording the manual build.
      - name: Install Swift toolchain (Windows)
        if: matrix.language == 'c-cpp'
        uses: compnerd/gha-setup-swift@bbae8ce86bac5a3449f3992b3d88bc4ca25f2057 # v0.5.0
        with:
          swift-version: swift-6.3.3-release
          swift-build: 6.3.3-RELEASE

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: manual
      - name: Build
        run: swift build
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          output: build/codeql-sarif

      # Main still has the successful pre-platform Swift configuration. Publish
      # the identical scan under that identity too so PR comparisons cover it;
      # the normal language+OS upload above remains authoritative and unchanged.
      - name: Copy Swift results for the legacy configuration
        if: matrix.language == 'swift'
        run: python3 scripts/codeql_category_alias.py build/codeql-sarif/swift.sarif build/codeql-legacy/swift.sarif

      - name: Upload the same Swift scan under its legacy identity
        if: matrix.language == 'swift'
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          sarif_file: build/codeql-legacy/swift.sarif
          category: .github/workflows/codeql.yml:analyze/language:swift
          matrix: '{"language":"swift"}'

  security-required:
    name: Security required
    if: ${{ always() }}
    needs: ["analyze"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every prerequisite to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = json.loads(os.environ["JOB_RESULTS"])
          failed = [name for name, job in results.items() if job["result"] != "success"]
          if failed:
              sys.exit("Unsuccessful prerequisites: " + ", ".join(failed))
          PY
