name: Stranded-branch check

# auto-merge-claude.yml only merges a branch once its CI run is green — a branch whose CI stays red
# is therefore skipped by every drain, forever, with no separate alert of its own. Likewise, an
# unresolved "Auto-merge conflict: <branch>" PR (opened when a merge could not be auto-resolved) just
# sits open until a human happens to notice it. Neither case fails loudly on its own; both leave real
# work sitting unmerged, unnoticed. This sweep runs every 6 hours and drives a single alert issue
# through its full lifecycle:
#   OPEN    the first sweep that finds a problem (notifies the repo owner).
#   REFRESH its body on every later sweep that still finds one, so one ongoing incident never spawns
#           a second issue.
#   CLOSE   it — with a comment saying why — on the first sweep that comes back clean, so an open
#           alert issue reliably means "there is a live problem right now" and not "there was one at
#           some point and nobody has closed it yet". Without this last step the alert would stay
#           open forever even after the underlying branch/PR problem was fixed, quietly destroying
#           the signal the alert exists to provide.

on:
  schedule:
    - cron: '23 */6 * * *'   # every 6h (UTC)
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read   # detect step reads ci.yml's workflow runs via the Actions API to measure branch staleness from CI.
  pull-requests: read
  issues: write

concurrency:
  group: stranded-branch-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Detect stranded branches + open conflict PRs
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_AGE_HOURS: '6'   # a healthy branch auto-merges within minutes of green CI; flags a branch once
                                # its CI run has been settled — or is still missing — for >6h without being
                                # merged. See the per-branch CI-run lookup below for exactly how age is
                                # measured; the tip commit's committer date is only a fallback (no run yet).
          MAX_INFLIGHT_HOURS: '12'   # a normal CI run here finishes in minutes, so a run that is STILL
                                      # not in a terminal state after 12h is wedged, not working — e.g. a
                                      # GitHub Actions outage (the motivating real-world case: runs get
                                      # stuck queued/in_progress and GitHub never marks them completed).
                                      # Deliberately much larger than MAX_AGE_HOURS: an in-flight run is
                                      # not stranded just for being slow, only for being wedged.
        run: |
          set -uo pipefail
          # Fetch ALL remote branches (checkout only brought main).
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune --quiet
          now=$(date -u +%s)

          : > /tmp/stranded.txt
          api_query_failed=0
          for ref in $(git for-each-ref --format='%(refname)' refs/remotes/origin/ \
                        | grep -v -E '^refs/remotes/origin/(main|HEAD)$' || true); do
            br=${ref#refs/remotes/}
            # Skip anything already contained in main.
            if git merge-base --is-ancestor "$ref" origin/main; then continue; fi

            sha="$(git rev-parse "$ref" 2>/dev/null)" || { echo "::warning::could not resolve $br to a SHA; skipping it this sweep."; continue; }

            # THE CLOCK: measure staleness from the branch's CI run, not its tip commit's committer
            # date. ci.yml triggers on every branch push, so the CI run for a branch's tip SHA is
            # created essentially at push time — a far better proxy for "when was this branch actually
            # pushed" than the committer date, which can be stale (rebase preserving dates,
            # cherry-pick, `git commit --date`, or just a long-lived local branch) and would otherwise
            # flag a branch pushed seconds ago that happens to carry an old commit. The run's status
            # also tells us whether the branch is even eligible to merge yet, which the committer date
            # never could:
            #   - no run for the tip SHA  -> CI hasn't produced a run (yet, or ever); fall back to the
            #                                tip-commit-date age as a coarse guard. This is the ONLY
            #                                place the committer date still drives the verdict.
            #   - run queued/in_progress  -> in flight; not stranded while it is genuinely progressing.
            #                                BUT a run that never reaches a terminal state must not be
            #                                able to hide a branch forever — that is exactly what a
            #                                GitHub Actions outage produces (runs wedge in
            #                                queued/in_progress and GitHub never marks them completed),
            #                                and it is the real-world case that motivates this branch.
            #                                Two thresholds exist for this reason: MAX_AGE_HOURS (short)
            #                                covers settled-or-missing runs, which resolve within minutes
            #                                when everything is healthy; MAX_INFLIGHT_HOURS (long) is the
            #                                outer bound past which a still-non-terminal run is presumed
            #                                wedged rather than working. Age here is measured from the
            #                                run's `created_at` (when it was queued), NOT `updated_at` —
            #                                a wedged run's `updated_at` can keep ticking even though the
            #                                run itself never finishes.
            #   - run completed           -> genuinely settled; age is measured from the run's
            #                                `updated_at` (when it reached its terminal state), and its
            #                                `conclusion` is the actionable fact (failure -> fix CI,
            #                                cancelled -> needs a re-run since the one-shot retry only
            #                                fires on failure, success -> green but still unmerged).
            #
            # Mirrors auto-merge-claude.yml's own CI-run lookup (per_page=20, newest run selected
            # explicitly by max(.id) rather than trusted array order) so this file's verdict can never
            # disagree with the merge gate's own read because of ordering.
            if ! runs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&per_page=20" 2>/tmp/gh_api_err.txt)"; then
              api_query_failed=1
              echo "::warning::Could not query CI runs for \`$br\` (tip $(git rev-parse --short "$ref")): $(tr '\n' ' ' < /tmp/gh_api_err.txt) — treating as a problem instead of silently reporting the branch healthy."
              continue
            fi

            # Fields are separated by "|", NOT a tab. Tab is an IFS *whitespace* character, so bash
            # collapses runs of tabs into a single delimiter and strips leading/trailing ones -- an
            # empty middle field would silently shift every later field one position left (verified:
            # `IFS=$'\t' read -r a b c <<< $'completed\t\t2026-01-01T00:00:00Z'` yields
            # conclusion=2026-01-01T00:00:00Z, updated_at=""). "|" is not IFS whitespace, so empty
            # fields are preserved positionally. No GitHub run status/conclusion value contains "|".
            row="$(printf '%s' "$runs_json" | jq -r '
              if (.workflow_runs | type) != "array" then "|||"
              else ((.workflow_runs | max_by(.id)) as $r |
                if $r == null then "|||"
                else (($r.status // "") + "|" + ($r.conclusion // "") + "|" + ($r.updated_at // "") + "|" + ($r.created_at // ""))
                end)
              end' 2>/dev/null || true)"
            IFS='|' read -r run_status run_conclusion run_updated_at run_created_at <<< "$row"

            if [ -z "$run_status" ]; then
              # No CI run exists yet for the tip SHA — CI may simply not have started. Fall back to
              # the tip-commit-date age as a coarse guard.
              ct=$(git log -1 --format='%ct' "$ref")
              age=$(( (now - ct) / 3600 ))
              if [ "$age" -ge "$MAX_AGE_HOURS" ]; then
                echo "- \`$br\` — unmerged; no CI run found for tip commit, which is ${age}h old (tip $(git rev-parse --short "$ref"))" >> /tmp/stranded.txt
              fi
            elif [ "$run_status" != "completed" ]; then
              # Non-terminal (queued/in_progress/waiting/...). Not stranded while it's genuinely still
              # progressing, but must not be allowed to hide the branch forever if it's wedged (e.g. a
              # GitHub Actions outage) — see MAX_INFLIGHT_HOURS above. Age is from `created_at` (when
              # queued), not `updated_at`, since a wedged run's `updated_at` may keep ticking.
              #
              # NB: `date -u -d ""` (GNU date) EXITS 0 and returns today's midnight UTC rather than
              # failing — verified on real GNU date — so emptiness must be checked directly on the
              # string, not inferred from date's exit status (same fix as the `updated_at` handling
              # below).
              if [ -n "$run_created_at" ]; then
                created_epoch="$(date -u -d "$run_created_at" +%s 2>/dev/null)" || created_epoch=""
              else
                created_epoch=""
              fi
              if [ -z "$created_epoch" ]; then
                echo "::warning::Could not parse CI run created_at ('$run_created_at') for \`$br\`; falling back to tip-commit-date age."
                ct=$(git log -1 --format='%ct' "$ref")
                age=$(( (now - ct) / 3600 ))
                if [ "$age" -ge "$MAX_AGE_HOURS" ]; then
                  echo "- \`$br\` — unmerged; tip commit is ${age}h old (CI run's created_at was unparseable; run status: $run_status) (tip $(git rev-parse --short "$ref"))" >> /tmp/stranded.txt
                fi
              else
                age=$(( (now - created_epoch) / 3600 ))
                if [ "$age" -ge "$MAX_INFLIGHT_HOURS" ]; then
                  echo "- \`$br\` — unmerged; CI run has been stuck in '$run_status' for ${age}h (tip $(git rev-parse --short "$ref"))" >> /tmp/stranded.txt
                fi
                # else: genuinely in flight and still within the wedged-run grace period — not stranded.
              fi
            else
              # `date -u -d ""` (GNU date) EXITS 0 and returns today's midnight UTC rather than failing
              # — verified on real GNU date — so we must check the string is non-empty ourselves BEFORE
              # calling `date`, rather than trusting a non-empty $updated_epoch to mean the parse
              # succeeded on real input.
              if [ -n "$run_updated_at" ]; then
                updated_epoch="$(date -u -d "$run_updated_at" +%s 2>/dev/null)" || updated_epoch=""
              else
                updated_epoch=""
              fi
              if [ -z "$updated_epoch" ]; then
                echo "::warning::Could not parse CI run updated_at ('$run_updated_at') for \`$br\`; falling back to tip-commit-date age."
                ct=$(git log -1 --format='%ct' "$ref")
                age=$(( (now - ct) / 3600 ))
                if [ "$age" -ge "$MAX_AGE_HOURS" ]; then
                  echo "- \`$br\` — unmerged; tip commit is ${age}h old (CI run's updated_at was unparseable) (tip $(git rev-parse --short "$ref"))" >> /tmp/stranded.txt
                fi
              else
                age=$(( (now - updated_epoch) / 3600 ))
                if [ "$age" -ge "$MAX_AGE_HOURS" ]; then
                  echo "- \`$br\` — unmerged; CI run settled ${age}h ago (conclusion: ${run_conclusion:-unknown}) (tip $(git rev-parse --short "$ref"))" >> /tmp/stranded.txt
                fi
              fi
            fi
          done

          # READ FAILURE (API rate limit, token/permission hiccup, transient GH outage) is NOT the same
          # as "zero open conflict PRs" — treating a failed `gh pr list` call as an empty result would
          # let the check never having run silently report "OK: no ... open conflict PRs". The signal
          # for "did the read fail?" is `gh pr list`'s OWN EXIT STATUS, captured below into
          # `pr_list_failed` — NOT whether it wrote anything to stderr. Some failure modes (runner
          # OOM/timeout, certain `gh` failure paths) exit non-zero with EMPTY stderr; keying off
          # `[ -s /tmp/gh_pr_list_error.txt ]` instead would silently treat exactly those failures as
          # "no problem", which is the very silent-pass this whole block exists to prevent. (No separate
          # pre-truncation of /tmp/conflicts.txt is needed here — the `>` redirect below already
          # truncates it before `gh` runs, on both the success and failure path; the `then`-branch
          # re-truncation is what guards against partial output surviving a failed read, since that runs
          # AFTER gh may have already written partial stdout through the redirect.)
          if gh pr list --repo "$GITHUB_REPOSITORY" --state open --json number,title,url \
                --jq '.[] | select(.title|startswith("Auto-merge conflict:")) | "- #\(.number) \(.title) (\(.url))"' \
                > /tmp/conflicts.txt 2>/tmp/gh_pr_list_error.txt; then
            pr_list_failed=0
            : > /tmp/gh_pr_list_error.txt   # successful read — no error to report
          else
            pr_list_failed=1
            : > /tmp/conflicts.txt   # a failed read must not carry over partial/stale output
          fi
          echo "pr_list_failed=$pr_list_failed" >> "$GITHUB_OUTPUT"

          if [ "$pr_list_failed" -eq 1 ] || [ "$api_query_failed" -eq 1 ]; then
            echo "problem=true" >> "$GITHUB_OUTPUT"
            if [ "$pr_list_failed" -eq 1 ]; then
              if [ -s /tmp/gh_pr_list_error.txt ]; then
                echo "::warning::Could not check for open 'Auto-merge conflict:' PRs ($(tr '\n' ' ' < /tmp/gh_pr_list_error.txt)) — treating as a problem so a gh/API failure surfaces instead of silently reporting OK."
              else
                echo "::warning::Could not check for open 'Auto-merge conflict:' PRs (gh pr list exited non-zero with no error output) — treating as a problem so a gh/API failure surfaces instead of silently reporting OK."
              fi
            fi
            # api_query_failed's own ::warning:: (naming the branch) was already emitted inline in the
            # per-branch loop above, at the point the `gh api` call failed.
          elif [ -s /tmp/stranded.txt ] || [ -s /tmp/conflicts.txt ]; then
            echo "problem=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Stranded branch / unmerged work detected — see the alert step / opened issue."
          else
            echo "problem=false" >> "$GITHUB_OUTPUT"
            echo "OK: no stranded branches (CI settled or missing > ${MAX_AGE_HOURS}h; CI stuck in-flight > ${MAX_INFLIGHT_HOURS}h), no open conflict PRs."
          fi

      - name: Open alert issue (dedup) and fail the run
        if: steps.detect.outputs.problem == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_LIST_FAILED: ${{ steps.detect.outputs.pr_list_failed }}
        run: |
          set -uo pipefail
          {
            echo "A branch's work may be sitting unmerged with no automatic signal: auto-merge-claude.yml only merges a branch once its CI run is green, so a branch whose CI stays red is skipped by every drain indefinitely, and an unresolved \`Auto-merge conflict:\` PR sits open until someone notices it."
            echo
            if [ -s /tmp/stranded.txt ]; then
              echo "**Stranded branches (unmerged: CI settled or missing > 6h, or CI stuck in a non-terminal status > 12h):**"; echo; cat /tmp/stranded.txt; echo
            fi
            if [ -s /tmp/conflicts.txt ]; then
              echo "**Open auto-merge conflict PRs:**"; echo; cat /tmp/conflicts.txt; echo
            fi
            if [ -s /tmp/gh_pr_list_error.txt ]; then
              echo "**Could not check for open 'Auto-merge conflict:' PRs** (\`gh pr list\` failed — this is a monitoring gap, not necessarily a stranded branch): $(cat /tmp/gh_pr_list_error.txt)"; echo
            elif [ "${PR_LIST_FAILED:-0}" = "1" ]; then
              echo "**Could not check for open 'Auto-merge conflict:' PRs** (\`gh pr list\` exited non-zero with no error output — this is a monitoring gap, not necessarily a stranded branch)"; echo
            fi
            echo "**Resolve:** for a red/failed branch, re-run CI for its tip (\`gh workflow run ci.yml --ref <branch>\`) or push a new commit to produce a fresh CI run. For a branch whose CI run is stuck in a non-terminal status (queued/in_progress and not actually progressing — e.g. during a GitHub Actions outage), cancel the wedged run and re-run CI (\`gh run cancel <run-id>\` then \`gh workflow run ci.yml --ref <branch>\`), or just push a new commit to produce a fresh run. Either way, auto-merge drains the branch automatically once a run completes green (the gate is fail-closed, so it never merges on its own without a green run for the exact tip SHA). Otherwise, merge/close the conflict PR, or delete the branch if it is obsolete."
          } > /tmp/body.md

          # Dedup by title prefix (avoids a new issue every 6h while one incident is open).
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --json number,title \
            --jq '[.[] | select(.title|startswith("⚠️ Stranded branch"))][0].number // empty')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.md \
              && echo "Alert issue #$existing already open; body refreshed with the current stranded list." \
              || echo "::warning::could not refresh issue #$existing body (transient gh failure?) — issue remains open with a stale body."
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "⚠️ Stranded branch / unmerged work detected" \
              --body-file /tmp/body.md
          fi
          exit 1   # surface red in the Actions tab too

      - name: Close resolved alert issue(s)
        # GATED ON A GENUINELY CLEAN SWEEP, NEVER ON "NOT PROVEN UNHEALTHY". `problem` is written
        # 'false' by the detect step ONLY in its trailing `else` branch above — reached ONLY when the
        # per-branch loop finished with `api_query_failed` never set (every `gh api` CI-run lookup
        # succeeded for every branch), AND `gh pr list` itself succeeded (`pr_list_failed=0`), AND
        # neither /tmp/stranded.txt nor /tmp/conflicts.txt ended up with any content. Both read-failure
        # paths (`pr_list_failed=1`, `api_query_failed=1`) force `problem=true` instead, specifically so
        # a broken CHECK can never be mistaken for a healthy repo. And if the detect step were to die
        # before writing any `problem=` output at all, `steps.detect.outputs.problem` is simply empty,
        # `'' == 'false'` is false, and this step is skipped — a crashed detect step therefore fails
        # safe (alert stays open) rather than fail-open (alert closed while the real state is unknown).
        # Closing an alert because the CHECK broke, rather than because the underlying problem is
        # actually gone, would be the worst possible failure mode: it would erase the exact signal this
        # whole workflow exists to provide.
        if: steps.detect.outputs.problem == 'false'
        # `issues: write` is already declared at the workflow level (see the top of this file); this
        # step needs nothing beyond that, so no additional `permissions:` block is added here.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail

          # Only ever touch an issue this automation itself opened. Matching the same title prefix the
          # create/dedup step above uses is necessary but not sufficient — nothing stops a human from
          # opening an issue with a coincidentally matching title — so ALSO require the author to be a
          # bot. Verified empirically against this repo's own real alert issue (opened earlier by this
          # workflow's GITHUB_TOKEN, via `gh issue view <n> --json author`): `author.login` rendered as
          # "app/github-actions" and `author.is_bot` was `true`. Filtering on `is_bot` rather than the
          # exact login string is the more stable choice — the literal rendering of a bot's login is a
          # GitHub display detail, `is_bot` is the documented, structural signal.
          if ! open_json="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --json number,title,author 2>/tmp/gh_issue_list_close_err.txt)"; then
            # A FAILED lookup is NOT the same as "found nothing to close" — mirrors how the detect step
            # above distinguishes `pr_list_failed` from a genuinely empty /tmp/conflicts.txt. Silently
            # treating this failure as "nothing to close" could leave a truly resolved alert open
            # forever if `gh issue list` happened to fail on every sweep after the real fix landed. Warn
            # loudly and move on instead of failing the run — a stale-but-open issue is a minor gap, not
            # a reason to redden a healthy sweep's run.
            echo "::warning::Could not list open issues to look for a resolved stranded-branch alert to close ($(tr '\n' ' ' < /tmp/gh_issue_list_close_err.txt)) — leaving any existing alert issue open rather than risk closing blind."
          else
            mapfile -t to_close < <(printf '%s' "$open_json" \
              | jq -r '.[] | select((.title|startswith("⚠️ Stranded branch")) and (.author.is_bot == true)) | .number')

            if [ "${#to_close[@]}" -eq 0 ]; then
              echo "No open bot-authored stranded-branch alert issue found — nothing to close."
            fi

            # Loop, don't just close the first match: the dedup step above means there should only ever
            # be one, but if two somehow exist, leaving a second one open recreates the exact
            # stale-signal problem this step exists to fix.
            run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            for n in "${to_close[@]}"; do
              # Comment BEFORE closing so the issue's own history explains itself to a future reader
              # without needing to cross-reference this workflow file. Chained with `&&` so a comment
              # that fails to post never leads to a silent close with no explanation left behind.
              if gh issue comment "$n" --repo "$GITHUB_REPOSITORY" \
                   --body "This sweep found no stranded branches and no open \`Auto-merge conflict:\` PRs. Closing. Run: $run_url" \
                 && gh issue close "$n" --repo "$GITHUB_REPOSITORY" --reason completed; then
                echo "Closed resolved alert issue #$n."
              else
                # FAIL SOFT, LOUDLY — exactly mirrors how the dedup step above handles a failed
                # `gh issue edit` ("could not refresh issue #N body"). A failure to close is a minor gap
                # (a stale issue lingers until the next healthy sweep retries it); it must NOT turn this
                # healthy sweep's run red, since a red run on a healthy repo would itself be a
                # misleading signal — so warn via `::warning::` rather than `continue-on-error:`, which
                # would swallow the failure silently instead of surfacing it in the log.
                echo "::warning::could not close alert issue #$n even though this sweep is clean (transient gh failure commenting or closing?) — issue remains open; the next healthy sweep retries."
              fi
            done
          fi
